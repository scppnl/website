name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a main run midway through publishing Workers or API images.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Build and test affected projects
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sites: ${{ steps.ci.outputs.sites }}
      containers: ${{ steps.ci.outputs.containers }}
    env:
      CI: 'true'
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      NX_TUI: 'false'
    steps:
      - name: Check out the PR head or pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/apps/*/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.19.1
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install orchestration dependencies
        run: npm ci --no-audit --no-fund
      - name: Check CI tooling
        run: npm run ci:tooling
      - name: Build and test affected projects
        id: ci
        run: npm run ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TURNSTILE_SITE_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.CONTACT_TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
          BOOKING_TURNSTILE_SITE_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.BOOKING_TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
          REQUIRE_TURNSTILE_SITE_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - name: Upload association assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && contains(steps.ci.outputs.sites, 'frontpage-association')
        uses: actions/upload-artifact@v4
        with:
          name: frontpage-association-${{ github.sha }}
          path: src/apps/frontpage-association/dist/client/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          overwrite: true
      - name: Upload foundation assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && contains(steps.ci.outputs.sites, 'frontpage-foundation')
        uses: actions/upload-artifact@v4
        with:
          name: frontpage-foundation-${{ github.sha }}
          path: src/apps/frontpage-foundation/dist/frontpage-foundation/browser/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          overwrite: true

  docker:
    name: Build and publish affected API images
    needs: check
    if: needs.check.outputs.containers != '' && needs.check.outputs.containers != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      published: ${{ steps.publish.outputs.published }}
    env:
      CI: 'true'
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      NX_TUI: 'false'
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.19.1
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Native AOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang zlib1g-dev
      - name: Install orchestration dependencies
        run: npm ci --no-audit --no-fund
      - name: Publish native APIs and build images
        run: node eng/containers.mjs
        env:
          CONTAINERS: ${{ needs.check.outputs.containers }}
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_KEY }}
      - name: Publish versioned API images
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: publish
        run: node eng/publish-containers.mjs
        env:
          CONTAINERS: ${{ needs.check.outputs.containers }}
          DOCKER_HUB_USER: ${{ vars.DOCKER_HUB_USER }}

  deploy-api:
    name: Deploy ${{ matrix.service }}
    needs: [check, docker]
    # A failed batch can still contain verified images. Keep publication failed,
    # but deploy those successes; never deploy a pushed but unverified image.
    if: >-
      !cancelled() && needs.check.result == 'success' &&
      (needs.docker.result == 'success' || needs.docker.result == 'failure') &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.docker.outputs.published != '' && needs.docker.outputs.published != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.docker.outputs.published || '[]') }}
    environment:
      name: production
      url: ${{ steps.target.outputs.url }}
    env:
      SERVICE: ${{ matrix.service }}
      DIGEST: ${{ matrix.digest }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate production API target
        id: target
        run: node eng/cloud-run.mjs target
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Deploy verified image to existing service
        id: publish
        run: node eng/cloud-run.mjs deploy
      - name: Check deployed API
        id: smoke
        run: node eng/cloud-run.mjs smoke
      - name: Summarize API deployment
        if: always()
        env:
          API_SERVICE: ${{ steps.target.outputs.service }}
          API_URL: ${{ steps.target.outputs.url }}
          IMAGE_DIGEST: ${{ steps.target.outputs.digest }}
          REVISION: ${{ steps.publish.outputs.revision }}
          PUBLISH: ${{ steps.publish.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          OUTCOME: ${{ job.status }}
        run: |
          printf 'Service: %s\n\nURL: %s\n\nRevision: `%s`\n\nImage digest: `%s`\n\nCommit: `%s`\n\nOutcome: %s; deploy: %s; smoke checks: %s\n' \
            "${API_SERVICE:-unavailable}" "$API_URL" "${REVISION:-unavailable}" "$IMAGE_DIGEST" "$GITHUB_SHA" \
            "$OUTCOME" "$PUBLISH" "$SMOKE" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Publish
    needs: check
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.check.outputs.sites != '' && needs.check.outputs.sites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.check.outputs.sites) }}
    environment:
      name: production
      url: ${{ steps.site.outputs.url }}
    env:
      CI: 'true'
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve production target
        id: site
        run: node eng/production.mjs site "$PROJECT"
        env:
          PROJECT: ${{ matrix.project }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ steps.site.outputs.directory }}/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.19.1
      - name: Install locked deployment tooling
        working-directory: ${{ steps.site.outputs.directory }}
        run: npm ci --no-audit --no-fund
      - name: Download tested assets
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ github.sha }}
          path: ${{ steps.site.outputs.assets }}
      - name: Validate restored hosting artifact
        working-directory: ${{ steps.site.outputs.directory }}
        run: npm run check:hosting
      - name: Publish existing Worker
        id: publish
        run: node eng/production.mjs deploy "$PROJECT"
        env:
          PROJECT: ${{ matrix.project }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check published site
        id: smoke
        run: node eng/smoke-hosting.mjs "$PROJECT"
        env:
          PROJECT: ${{ matrix.project }}
      - name: Summarize deployment
        if: always()
        env:
          WORKER: ${{ steps.site.outputs.worker }}
          SITE_URL: ${{ steps.site.outputs.url }}
          PUBLISH: ${{ steps.publish.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          printf 'Worker: %s\n\nURL: %s\n\nCommit: `%s`\n\nPublish: %s; smoke checks: %s\n' \
            "$WORKER" "$SITE_URL" "$GITHUB_SHA" "$PUBLISH" "$SMOKE" >> "$GITHUB_STEP_SUMMARY"
