name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test affected projects
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      NX_TUI: 'false'
    steps:
      - name: Check out the PR head or pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/apps/*/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.19.1
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install orchestration dependencies
        run: npm ci --no-audit --no-fund
      - name: Check CI tooling
        run: npm run ci:tooling
      - name: Build and test affected projects
        run: npm run ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
