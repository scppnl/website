<header class="header">
  <div class="container header__inner">
    <a class="brand" routerLink="/" [attr.aria-label]="foundation.name" (click)="closeMenu()">
      <app-logo class="brand__mark" [size]="40" />
      <span class="brand__name">
        <span class="brand__prefix">Stichting</span>
        <span class="brand__title">{{ brandTitle }}</span>
      </span>
    </a>

    <div class="actions">
      <a class="btn btn--accent compact-cta" routerLink="/reserveren" (click)="closeMenu()"
        >Reserveer nu</a
      >
      <button
        type="button"
        #menuToggle
        class="menu-toggle"
        aria-controls="main-nav"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="menuOpen() ? 'Menu sluiten' : 'Menu openen'"
        (click)="toggleMenu()"
      >
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="26" [strokeWidth]="2" />
      </button>
    </div>

    <nav id="main-nav" class="nav" aria-label="Hoofdmenu" [class.nav--open]="menuOpen()">
      <ul>
        @for (item of navItems; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="closeMenu()"
            >
              <span>{{ item.label }}</span>
              <app-icon class="nav__chevron" name="chevron-right" [size]="20" [strokeWidth]="2.2" />
            </a>
          </li>
        }
      </ul>
      <div class="nav__foot">
        <a class="btn btn--accent nav__cta" routerLink="/reserveren" (click)="closeMenu()"
          >Reserveer nu</a
        >
        <address class="nav__contact">
          <span>
            <app-icon name="map-pin" [size]="18" />
            {{ foundation.address.street }}, {{ foundation.address.city }}
          </span>
          <a routerLink="/contact" (click)="closeMenu()">
            <app-icon name="chevron-right" [size]="18" />
            Neem contact op
          </a>
        </address>
      </div>
    </nav>
  </div>
</header>
