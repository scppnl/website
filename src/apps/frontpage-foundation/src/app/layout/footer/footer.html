<footer class="footer on-dark">
  <div class="container footer__grid">
    <section class="footer__about">
      <p class="footer__name">{{ foundation.name }}</p>
      <address>
        {{ foundation.address.street }}<br />
        {{ foundation.address.postalCode }} {{ foundation.address.city }}
      </address>
    </section>

    <nav aria-label="Voettekst">
      <p class="footer__heading">Menu</p>
      <ul>
        @for (item of navItems; track item.path) {
          <li>
            <a [routerLink]="item.path">{{ item.label }}</a>
          </li>
        }
        <li><a routerLink="/reserveren">Reserveren</a></li>
      </ul>
    </nav>
  </div>
  <p class="footer__copy container">© {{ year() }} {{ foundation.name }}</p>
</footer>
